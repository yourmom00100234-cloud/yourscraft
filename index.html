<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 마인크래프트 멀티플레이</title>
    
    <!-- 구글 애드센스 스크립트 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2157167042014574"
         crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none;
            background-color: #000;
        }
        #canvas { width: 100%; height: 100%; display: block; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background-color: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
        #hud { color: white; text-shadow: 1px 1px 2px black; font-size: 14px; line-height: 1.5; }
        #hotbar {
            display: flex; justify-content: center; gap: 4px; background: rgba(0,0,0,0.5);
            padding: 6px; border-radius: 8px; pointer-events: auto; align-self: center; border: 2px solid rgba(255,255,255,0.2);
        }
        .slot {
            width: 50px; height: 50px; background: rgba(0,0,0,0.6); border: 2px solid #444;
            border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; color: white; font-weight: bold;
        }
        .slot.selected { border-color: #55ff55; background: rgba(255,255,255,0.25); }
        .slot-num { position: absolute; top: 2px; left: 4px; color: #aaa; font-size: 10px; }
        
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; pointer-events: auto; text-align: center; z-index: 10;
        }
        #menu h1 { font-size: 2.8rem; color: #55ff55; margin-bottom: 20px; text-shadow: 2px 2px #00aa00; }
        .menu-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 15px; width: 320px; }
        input[type="text"] { width: 80%; padding: 8px; font-size: 16px; border-radius: 4px; border: none; margin-bottom: 10px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 4px; background: #55ff55; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #44cc44; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <div id="hud">
            <div id="status" style="color: #ffaa00; font-weight: bold;">대기 중... (방을 만들거나 참가하세요)</div>
            <div id="pos">XYZ: 0, 0, 0</div>
            <div id="online">연결 상태: 오프라인</div>
        </div>
        <div id="hotbar"></div>
    </div>
    
    <div id="crosshair"></div>

    <div id="menu">
        <h1>웹 마인크래프트 멀티</h1>
        
        <div class="menu-box">
            <h3>방 생성하기 (호스트)</h3>
            <button id="btn-create">새 방 만들기</button>
            <div id="my-room-id" style="margin-top: 10px; font-size: 14px; color: #55ff55; word-break: break-all;"></div>
        </div>

        <div class="menu-box">
            <h3>방 참가하기 (게스트)</h3>
            <input type="text" id="join-room-id" placeholder="방 ID 입력">
            <button id="btn-join">방 참가</button>
        </div>

        <p style="margin-top: 15px; color: #aaa; font-size: 13px;">
            이동: WASD | 점프: Space | 블록 파괴: 좌클릭 | 블록 설치: 우클릭 | 선택: 1~3키
        </p>
        
        <button id="btn-start" style="display:none; margin-top:10px; background:#00aaff; color:white;">게임 시작 (화면 클릭)</button>
    </div>

    <!-- 외부 라이브러리 (Three.js 및 P2P 멀티플레이용 PeerJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        // --- 멀티플레이 P2P 로직 (PeerJS) ---
        let peer = null;
        let connections = [];
        let isHost = false;
        let myId = '';

        const statusEl = document.getElementById('status');
        const onlineEl = document.getElementById('online');
        const myRoomIdEl = document.getElementById('my-room-id');
        const menuEl = document.getElementById('menu');
        const btnStart = document.getElementById('btn-start');

        // P2P 피어 초기화
        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
            });

            peer.on('connection', (conn) => {
                setupConnection(conn);
            });
        }

        function setupConnection(conn) {
            connections.push(conn);
            onlineEl.innerText = `연결 상태: 연결됨 (${connections.length}명 접속)`;
            statusEl.innerText = '멀티플레이 연동 중...';

            conn.on('data', (data) => {
                handleNetworkData(data);
            });

            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                onlineEl.innerText = `연결 상태: 연결됨 (${connections.length}명 접속)`;
            });

            // 호스트일 경우 기존 블록 정보 전달
            if (isHost) {
                const worldArray = Array.from(world.entries());
                conn.send({ type: 'syncWorld', world: worldArray });
            }
        }

        function broadcast(data) {
            connections.forEach(conn => conn.send(data));
        }

        // 네트워크 데이터 수신 처리
        function handleNetworkData(data) {
            if (data.type === 'move') {
                updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry);
            } else if (data.type === 'block') {
                if (data.blockType === 0) world.delete(data.key);
                else world.set(data.key, data.blockType);
                renderWorld();
                if (isHost) broadcast(data); // 호스트면 다른 플레이어들에게도 재전파
            } else if (data.type === 'syncWorld') {
                world = new Map(data.world);
                renderWorld();
            }
        }

        // 방 만들기
        document.getElementById('btn-create').onclick = () => {
            if (!peer) initPeer();
            isHost = true;
            setTimeout(() => {
                if(myId) {
                    myRoomIdEl.innerText = `내 방 ID: ${myId}`;
                    statusEl.innerText = '방 생성 완료! 친구에게 ID를 알려주세요.';
                    btnStart.style.display = 'inline-block';
                }
            }, 1000);
        };

        // 방 참가하기
        document.getElementById('btn-join').onclick = () => {
            const targetId = document.getElementById('join-room-id').value.trim();
            if (!targetId) return alert('방 ID를 입력하세요!');
            
            if (!peer) peer = new Peer();
            setTimeout(() => {
                const conn = peer.connect(targetId);
                conn.on('open', () => {
                    setupConnection(conn);
                    statusEl.innerText = '방 참가 성공!';
                    btnStart.style.display = 'inline-block';
                });
            }, 800);
        };

        btnStart.onclick = () => {
            menuEl.style.display = 'none';
            document.body.requestPointerLock();
        };

        // --- 3D 마인크래프트 엔진 (Three.js) ---
        function createTex(c1, c2) {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = c1; ctx.fillRect(0, 0, 32, 32);
            for(let i=0; i<80; i++) {
                ctx.fillStyle = c2;
                ctx.fillRect(Math.random()*32, Math.random()*32, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        const materials = {
            1: new THREE.MeshLambertMaterial({ map: createTex('#55a035', '#4b902e') }), // 잔디
            2: new THREE.MeshLambertMaterial({ map: createTex('#8B5A2B', '#6e4420') }), // 흙
            3: new THREE.MeshLambertMaterial({ map: createTex('#808080', '#606060') }), // 돌
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas') });
        renderer.setSize(window.innerWidth, window.innerHeight);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 0.5);
        sun.position.set(20, 40, 20);
        scene.add(sun);

        // 월드 지형
        let world = new Map();
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blockGroup = new THREE.Group();
        scene.add(blockGroup);

        // 기본 맵 지형 생성
        for(let x=-10; x<=10; x++) {
            for(let z=-10; z<=10; z++) {
                world.set(`${x},0,${z}`, 1);
                world.set(`${x},-1,${z}`, 2);
            }
        }

        function renderWorld() {
            while(blockGroup.children.length > 0) blockGroup.remove(blockGroup.children[0]);
            world.forEach((id, key) => {
                const [x, y, z] = key.split(',').map(Number);
                const mesh = new THREE.Mesh(boxGeo, materials[id]);
                mesh.position.set(x, y, z);
                blockGroup.add(mesh);
            });
        }
        renderWorld();

        // 다른 플레이어 표현 (붉은색 바비 모델)
        const otherPlayers = {};
        const playerGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
        const playerMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });

        function updateOtherPlayer(id, x, y, z, ry) {
            if (!otherPlayers[id]) {
                const mesh = new THREE.Mesh(playerGeo, playerMat);
                scene.add(mesh);
                otherPlayers[id] = mesh;
            }
            otherPlayers[id].position.set(x, y, z);
            otherPlayers[id].rotation.y = ry;
        }

        // 조작 및 입력
        let isLocked = false;
        let selectedBlock = 1;

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
            if(!isLocked && menuEl.style.display === 'none') {
                menuEl.style.display = 'flex';
            }
        });

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.key >= '1' && e.key <= '3') {
                selectedBlock = parseInt(e.key);
                document.querySelectorAll('.slot').forEach((s, idx) => {
                    s.classList.toggle('selected', idx + 1 === selectedBlock);
                });
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        document.addEventListener('mousemove', e => {
            if (!isLocked) return;
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        });

        // 블록 클릭 조작
        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', e => {
            if (!isLocked) return;
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(blockGroup.children);
            if (hits.length > 0 && hits[0].distance < 6) {
                const hit = hits[0];
                let key = '';
                let blockType = 0;

                if (e.button === 0) { // 좌클릭: 파괴
                    const p = hit.object.position;
                    key = `${p.x},${p.y},${p.z}`;
                    world.delete(key);
                    blockType = 0;
                } else if (e.button === 2) { // 우클릭: 설치
                    const p = hit.object.position.clone().add(hit.face.normal);
                    key = `${p.x},${p.y},${p.z}`;
                    world.set(key, selectedBlock);
                    blockType = selectedBlock;
                }
                
                renderWorld();
                // 네트워크로 블록 변경 정보 동기화 전송
                broadcast({ type: 'block', key: key, blockType: blockType });
            }
        });
        window.oncontextmenu = e => e.preventDefault();

        // 핫바 UI 생성
        const hotbar = document.getElementById('hotbar');
        ['잔디', '흙', '돌'].forEach((name, idx) => {
            const slot = document.createElement('div');
            slot.className = `slot ${idx === 0 ? 'selected' : ''}`;
            slot.innerHTML = `<span class="slot-num">${idx+1}</span>${name}`;
            hotbar.appendChild(slot);
        });

        // 애니메이션 루프
        let velocity = new THREE.Vector3();
        let canJump = false;
        let lastSendTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (isLocked) {
                velocity.x -= velocity.x * 10 * 0.016;
                velocity.z -= velocity.z * 10 * 0.016;
                velocity.y -= 25 * 0.016;

                const dir = new THREE.Vector3();
                if (keys['KeyW']) dir.z -= 1;
                if (keys['KeyS']) dir.z += 1;
                if (keys['KeyA']) dir.x -= 1;
                if (keys['KeyD']) dir.x += 1;
                dir.normalize();

                if (keys['KeyW'] || keys['KeyS']) velocity.z += dir.z * 15 * 0.016;
                if (keys['KeyA'] || keys['KeyD']) velocity.x += dir.x * 15 * 0.016;
                if (keys['KeySpace'] && canJump) { velocity.y = 8; canJump = false; }

                const moveV = new THREE.Vector3();
                moveV.add(camera.getWorldDirection(new THREE.Vector3(0,0,-1)).setY(0).normalize().multiplyScalar(velocity.z * 0.016));
                const sideV = new THREE.Vector3(-Math.sin(camera.rotation.y - Math.PI/2), 0, -Math.cos(camera.rotation.y - Math.PI/2));
                moveV.add(sideV.multiplyScalar(velocity.x * 0.016));

                camera.position.add(moveV);
                camera.position.y += velocity.y * 0.016;

                if (camera.position.y < 2) {
                    camera.position.y = 2;
                    velocity.y = 0;
                    canJump = true;
                }

                document.getElementById('pos').innerText = `XYZ: ${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}`;

                // 실시간 내 위치 친구들에게 전송 (0.05초마다)
                if (performance.now() - lastSendTime > 50) {
                    broadcast({
                        type: 'move',
                        id: myId,
                        x: camera.position.x,
                        y: camera.position.y - 0.9,
                        z: camera.position.z,
                        ry: camera.rotation.y
                    });
                    lastSendTime = performance.now();
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
