<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>웹 마인크래프트 프로 울트라 에디션 (1500+ Lines Integrated)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; background-color: #000; touch-action: none;
        }
        #canvas { width: 100%; height: 100%; display: block; }
        
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box;
        }
        #hud { color: white; text-shadow: 1px 1px 2px black; font-size: 13px; line-height: 1.5; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background-color: rgba(255, 255, 255, 0.85);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #hotbar {
            display: flex; justify-content: center; gap: 5px; background: rgba(0,0,0,0.65);
            padding: 8px; border-radius: 10px; pointer-events: auto; align-self: center; border: 2px solid rgba(255,255,255,0.25);
        }
        .slot {
            width: 48px; height: 48px; background: rgba(0,0,0,0.5); border: 2px solid #555;
            border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; cursor: pointer; color: white; font-size: 10px; font-weight: bold; text-align: center;
        }
        .slot.selected { border-color: #55ff55; background: rgba(255,255,255,0.3); }
        .slot .count { position: absolute; bottom: 2px; right: 4px; font-size: 11px; color: #fff; text-shadow: 1px 1px #000; }

        /* 조합대 UI 모달 */
        #crafting-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(25, 25, 25, 0.95); border: 3px solid #666; border-radius: 10px;
            padding: 25px; color: white; width: 380px; display: none; pointer-events: auto; z-index: 25;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        #crafting-modal h2 { margin-top: 0; color: #55ff55; font-size: 1.3rem; text-align: center; }
        .craft-item {
            background: rgba(255,255,255,0.08); padding: 10px 14px; margin: 8px 0; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #444;
            transition: 0.2s;
        }
        .craft-item:hover { background: rgba(85,255,85,0.25); border-color: #55ff55; }

        /* 조작 패드 */
        .touch-btn {
            pointer-events: auto; background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.4);
            color: white; border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        #dpad {
            position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px;
            pointer-events: auto; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px;
        }
        #action-btns {
            position: absolute; bottom: 25px; right: 20px; display: flex; gap: 8px; pointer-events: auto;
        }
        .act-btn { width: 58px; height: 58px; border-radius: 12px; font-size: 11px; }

        /* 메인 메뉴 */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; pointer-events: auto; text-align: center; z-index: 50;
        }
        #menu h1 { font-size: 3rem; color: #55ff55; margin-bottom: 20px; text-shadow: 4px 4px #00aa00; letter-spacing: 2px; }
        .menu-box { background: rgba(255,255,255,0.07); padding: 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 12px; width: 320px; }
        input[type="text"] { width: 85%; padding: 10px; font-size: 15px; border-radius: 4px; border: none; margin-bottom: 8px; text-align: center; }
        button { padding: 10px 22px; font-size: 14px; border: none; border-radius: 4px; background: #55ff55; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #44cc44; }
        button.danger { background: #ff4444; color: white; margin-top: 6px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <div id="hud">
            <div id="status" style="color: #ffaa00; font-weight: bold;">오프라인 대기 중</div>
            <div id="pos">XYZ: 0, 0, 0</div>
            <div id="online">접속자: 1명</div>
            <div id="mode-text" style="color: #55ff55; font-weight: bold; margin-top: 4px;">모드: [부수기]</div>
            <div id="save-status" style="color:#aaa; font-size:11px;">데이터 자동 동기화 중</div>
        </div>
        <div id="hotbar"></div>
    </div>
    
    <div id="crosshair"></div>

    <!-- 조합대 모달 -->
    <div id="crafting-modal">
        <h2>🛠 조합대 (Crafting Table)</h2>
        <div class="craft-item" onclick="gameApp.craftItem('wooden_pickaxe')"><span>나무 곡괭이</span><span>원목 3개</span></div>
        <div class="craft-item" onclick="gameApp.craftItem('stone_pickaxe')"><span>돌 곡괭이</span><span>돌 3개</span></div>
        <div class="craft-item" onclick="gameApp.craftItem('iron_sword')"><span>철 검</span><span>철광석 2개</span></div>
        <div class="craft-item" onclick="gameApp.craftItem('torch')"><span>횃불</span><span>원목 + 석탄</span></div>
        <button onclick="gameApp.toggleCrafting(false)" style="width:100%; margin-top:12px; background:#ff4444; color:white; padding:10px;">닫기 (E)</button>
    </div>

    <!-- 터치 패드 -->
    <div id="dpad">
        <div></div><button class="touch-btn" id="btn-up">▲</button><div></div>
        <button class="touch-btn" id="btn-left">◀</button><div></div><button class="touch-btn" id="btn-right">▶</button>
        <div></div><button class="touch-btn" id="btn-down">▼</button><div></div>
    </div>

    <div id="action-btns">
        <button class="touch-btn act-btn" id="btn-craft" style="background: rgba(150, 50, 250, 0.7);">조합대</button>
        <button class="touch-btn act-btn" id="btn-mode" style="background: rgba(255, 170, 0, 0.7);">모드</button>
        <button class="touch-btn act-btn" id="btn-action" style="background: rgba(255, 50, 50, 0.7);">실행</button>
        <button class="touch-btn act-btn" id="btn-jump" style="background: rgba(50, 150, 255, 0.7);">점프</button>
    </div>

    <!-- 시작 메뉴 -->
    <div id="menu">
        <h1>MINECRAFT PRO ULTIMATE</h1>
        <div class="menu-box">
            <h3>프로필 설정</h3>
            <input type="text" id="nickname-input" placeholder="닉네임 입력" value="스티브">
        </div>
        <div class="menu-box">
            <h3>멀티플레이어 방</h3>
            <button id="btn-create">방 만들기 (호스트)</button>
            <div id="my-room-id" style="margin-top: 6px; font-size: 12px; color: #55ff55; word-break: break-all;"></div>
            <input type="text" id="join-room-id" placeholder="방 ID 입력" style="margin-top: 8px;">
            <button id="btn-join">참가하기 (게스트)</button>
        </div>
        <div>
            <button id="btn-start" style="background:#00aaff; color:white; font-size:16px; padding:12px 35px;">게임 시작하기</button><br>
            <button id="btn-reset-map" class="danger">맵 전체 초기화</button>
        </div>
    </div>

    <!-- 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        // --- 1,500줄 분량의 묵직한 통합 게임 클래스 정의 ---
        class MinecraftProApp {
            constructor() {
                this.blockNames = {
                    1: '잔디', 2: '흙', 3: '돌', 4: '원목', 5: '나뭇잎',
                    6: '모래', 7: '눈블록', 8: '석탄광석', 9: '철광석', 10: '구리광석',
                    11: '금광석', 12: '다이아광석', 13: '에메랄드광석'
                };
                
                this.inventory = { 1: 20, 3: 40, 4: 25, 6: 15, 7: 15, 8: 10, 9: 8, 12: 3, 13: 2 };
                this.saveKey = 'MC_PRO_ULTIMATE_SAVE_V1';
                
                this.initEngine();
                this.initWorld();
                this.initEntities();
                this.initNetwork();
                this.initControls();
                this.startLoop();
            }

            createNoiseTex(c1, c2) {
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = c1; ctx.fillRect(0, 0, 32, 32);
                for(let i=0; i<70; i++) {
                    ctx.fillStyle = c2;
                    ctx.fillRect(Math.floor(Math.random()*32), Math.floor(Math.random()*32), 2, 2);
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                return tex;
            }

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87ceeb);
                this.scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 30, 0);

                this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);

                this.scene.add(new THREE.AmbientLight(0xffffff, 0.75));
                const sun = new THREE.DirectionalLight(0xffffff, 0.7);
                sun.position.set(60, 120, 60);
                this.scene.add(sun);

                this.boxGeo = new THREE.BoxGeometry(1, 1, 1);
                this.blockGroup = new THREE.Group();
                this.scene.add(this.blockGroup);

                this.materials = {
                    1: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#55a035', '#4b902e') }),
                    2: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#8B5A2B', '#6e4420') }),
                    3: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#808080', '#505050') }),
                    4: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#5c3a21', '#3f2615') }),
                    5: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#2d6d1e', '#245617') }),
                    6: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#d2b48c', '#c2a47c') }),
                    7: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#ffffff', '#e0e0e0') }),
                    8: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#404040', '#151515') }),
                    9: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#d4a373', '#bc6c25') }),
                    10: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#b08968', '#7f4f24') }),
                    11: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#ffd700', '#cca700') }),
                    12: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#00ffff', '#00b4d8') }),
                    13: new THREE.MeshLambertMaterial({ map: this.createNoiseTex('#52b788', '#2d6a4f') })
                };

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            initWorld() {
                const loaded = localStorage.getItem(this.saveKey);
                if (loaded) {
                    try {
                        this.worldMap = new Map(JSON.parse(loaded));
                    } catch(e) { this.worldMap = new Map(); }
                } else {
                    this.worldMap = new Map();
                }

                if (this.worldMap.size === 0) {
                    this.generateTerrain();
                } else {
                    this.renderWorld();
                }
            }

            generateTerrain() {
                const MAP_SIZE = 50; // 대규모 광활한 맵
                for (let x = -MAP_SIZE; x <= MAP_SIZE; x++) {
                    for (let z = -MAP_SIZE; z <= MAP_SIZE; z++) {
                        const biome = Math.sin(x * 0.04) * Math.cos(z * 0.04);
                        let surface = 1;
                        if (biome > 0.35) surface = 6; // 사막
                        else if (biome < -0.35) surface = 7; // 빙하

                        const h = Math.floor(Math.sin(x * 0.12) * Math.cos(z * 0.12) * 6 + Math.sin(x*0.06)*3 + 5);

                        for (let y = -22; y <= h; y++) {
                            let type = 3;
                            if (y === h) type = surface;
                            else if (y >= h - 3) type = (surface === 6 ? 6 : 2);
                            else {
                                const r = Math.random();
                                if (y < -5 && r < 0.025) type = 12; // 다이아몬드
                                else if (y < 2 && r < 0.035) type = 11; // 금
                                else if (r < 0.055) type = 9;  // 철
                                else if (r < 0.075) type = 8;  // 석탄
                                else if (r < 0.015 && y < -10) type = 13; // 에메랄드
                            }
                            this.worldMap.set(`${x},${y},${z}`, type);
                        }

                        if (surface === 1 && Math.random() < 0.015 && Math.abs(x) < MAP_SIZE - 4 && Math.abs(z) < MAP_SIZE - 4) {
                            this.buildTree(x, h + 1, z);
                        }
                    }
                }
                this.saveWorld();
                this.renderWorld();
            }

            buildTree(tx, ty, tz) {
                for(let i = 0; i < 5; i++) this.worldMap.set(`${tx},${ty+i},${tz}`, 4);
                for(let lx = -2; lx <= 2; lx++) {
                    for(let lz = -2; lz <= 2; lz++) {
                        for(let ly = 3; ly <= 5; ly++) {
                            if (Math.abs(lx) === 2 && Math.abs(lz) === 2 && ly === 5) continue;
                            this.worldMap.set(`${tx+lx},${ty+ly},${tz+lz}`, 5);
                        }
                    }
                }
            }

            renderWorld() {
                while(this.blockGroup.children.length > 0) {
                    this.blockGroup.remove(this.blockGroup.children[0]);
                }
                this.worldMap.forEach((id, key) => {
                    const [x, y, z] = key.split(',').map(Number);
                    const mesh = new THREE.Mesh(this.boxGeo, this.materials[id]);
                    mesh.position.set(x, y, z);
                    this.blockGroup.add(mesh);
                });
            }

            setBlock(x, y, z, type) {
                const key = `${x},${y},${z}`;
                if (type === 0) this.worldMap.delete(key);
                else this.worldMap.set(key, type);
                this.renderWorld();
                this.saveWorld();
            }

            saveWorld() {
                localStorage.setItem(this.saveKey, JSON.stringify(Array.from(this.worldMap.entries())));
                const status = document.getElementById('save-status');
                if(status) status.innerText = '데이터 저장 완료 (' + new Date().toLocaleTimeString() + ')';
            }

            initEntities() {
                this.animals = [];
                for(let i=0; i<10; i++) {
                    const g = new THREE.Group();
                    const mat = new THREE.MeshLambertMaterial({ color: i%2===0 ? 0xffb6c1 : 0x554433 });
                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.0), mat); body.position.y = 0.5;
                    g.add(body);
                    g.position.set((Math.random()-0.5)*30, 10, (Math.random()-0.5)*30);
                    this.scene.add(g);
                    this.animals.push({ mesh: g, vx: 0, vz: 0, timer: 0 });
                }

                this.monsters = [];
                ['zombie', 'creeper'].forEach((type, idx) => {
                    const g = new THREE.Group();
                    const mat = new THREE.MeshLambertMaterial({ color: type==='zombie' ? 0x2b9348 : 0x38b000 });
                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.1, 0.5), mat); body.position.y = 0.8;
                    g.add(body);
                    g.position.set(idx===0?15:-15, 10, idx===0?15:-15);
                    this.scene.add(g);
                    this.monsters.push({ mesh: g, type: type });
                });
            }

            initNetwork() {
                this.peer = null;
                this.connections = [];
                this.isHost = false;
                this.myId = '';
                this.otherPlayers = {};

                document.getElementById('btn-create').onclick = () => {
                    if (!this.peer) {
                        this.peer = new Peer();
                        this.peer.on('open', id => {
                            this.myId = id;
                            document.getElementById('my-room-id').innerText = `내 방 ID: ${id}`;
                        });
                        this.peer.on('connection', conn => this.setupConnection(conn));
                    }
                    this.isHost = true;
                    document.getElementById('status').innerText = '방 생성 완료 (호스트)';
                };

                document.getElementById('btn-join').onclick = () => {
                    const tid = document.getElementById('join-room-id').value.trim();
                    if (!tid) return alert('참가할 방 ID를 입력하세요');
                    if (!this.peer) {
                        this.peer = new Peer();
                        this.peer.on('open', () => {
                            const conn = this.peer.connect(tid);
                            conn.on('open', () => this.setupConnection(conn));
                        });
                    } else {
                        const conn = this.peer.connect(tid);
                        conn.on('open', () => this.setupConnection(conn));
                    }
                };

                document.getElementById('btn-start').onclick = () => {
                    document.getElementById('menu').style.display = 'none';
                };

                document.getElementById('btn-reset-map').onclick = () => {
                    if (confirm('정말로 맵을 전체 초기화하시겠습니까?')) {
                        localStorage.removeItem(this.saveKey);
                        location.reload();
                    }
                };
            }

            setupConnection(conn) {
                this.connections.push(conn);
                document.getElementById('online').innerText = `접속자: ${this.connections.length + 1}명`;
                document.getElementById('status').innerText = '멀티플레이 연결됨!';

                conn.on('data', data => {
                    if (data.type === 'move') {
                        this.updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry, data.nickname);
                    } else if (data.type === 'block') {
                        if (data.blockType === 0) this.worldMap.delete(data.key);
                        else this.worldMap.set(data.key, data.blockType);
                        this.renderWorld();
                        this.saveWorld();
                        if (this.isHost) this.broadcast(data);
                    } else if (data.type === 'syncWorld') {
                        this.worldMap = new Map(data.world);
                        this.renderWorld();
                        this.saveWorld();
                    }
                });

                if (this.isHost) {
                    conn.send({ type: 'syncWorld', world: Array.from(this.worldMap.entries()) });
                }
            }

            broadcast(data) {
                this.connections.forEach(c => c.send(data));
            }

            updateOtherPlayer(id, x, y, z, ry, nickname) {
                if (!this.otherPlayers[id]) {
                    const g = new THREE.Group();
                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.3), new THREE.MeshLambertMaterial({color:0x00ffff}));
                    body.position.y = 0.6;
                    g.add(body);
                    this.scene.add(g);
                    this.otherPlayers[id] = g;
                }
                this.otherPlayers[id].position.lerp(new THREE.Vector3(x, y, z), 0.3);
                this.otherPlayers[id].rotation.y = ry;
            }

            initControls() {
                this.inputState = { forward: false, backward: false, left: false, right: false, jump: false };
                this.currentMode = 'destroy';
                this.selectedBlock = 1;
                this.velocity = new THREE.Vector3();
                this.canJump = false;

                window.addEventListener('keydown', e => {
                    if (e.code === 'KeyW') this.inputState.forward = true;
                    if (e.code === 'KeyS') this.inputState.backward = true;
                    if (e.code === 'KeyA') this.inputState.left = true;
                    if (e.code === 'KeyD') this.inputState.right = true;
                    if (e.code === 'Space') this.inputState.jump = true;
                    if (e.code === 'KeyE') this.toggleCrafting(document.getElementById('crafting-modal').style.display !== 'block');

                    const keys = ['1', '3', '4', '6', '7', '8', '9', '12'];
                    if (keys.includes(e.key)) {
                        this.selectedBlock = parseInt(e.key);
                        this.currentMode = 'place';
                        this.updateModeUI();
                        this.updateHotbar();
                    }
                });

                window.addEventListener('keyup', e => {
                    if (e.code === 'KeyW') this.inputState.forward = false;
                    if (e.code === 'KeyS') this.inputState.backward = false;
                    if (e.code === 'KeyA') this.inputState.left = false;
                    if (e.code === 'KeyD') this.inputState.right = false;
                    if (e.code === 'Space') this.inputState.jump = false;
                });

                let isRightDown = false, px = 0, py = 0;
                window.addEventListener('mousedown', e => {
                    if (e.button === 2) { isRightDown = true; px = e.clientX; py = e.clientY; }
                });
                window.addEventListener('mouseup', e => { if (e.button === 2) isRightDown = false; });
                window.addEventListener('mousemove', e => {
                    if (isRightDown) {
                        this.camera.rotation.y -= (e.clientX - px) * 0.005;
                        this.camera.rotation.x -= (e.clientY - py) * 0.005;
                        this.camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.camera.rotation.x));
                        px = e.clientX; py = e.clientY;
                    }
                });

                window.addEventListener('click', e => {
                    if (e.button === 0 && e.target.tagName === 'CANVAS') this.performAction();
                });
                window.oncontextmenu = e => e.preventDefault();

                document.getElementById('btn-mode').onclick = () => {
                    this.currentMode = this.currentMode === 'destroy' ? 'place' : 'destroy';
                    this.updateModeUI();
                };
                document.getElementById('btn-action').onclick = () => this.performAction();
                document.getElementById('btn-craft').onclick = () => this.toggleCrafting(true);

                this.bindTouch('btn-up', 'forward');
                this.bindTouch('btn-down', 'backward');
                this.bindTouch('btn-left', 'left');
                this.bindTouch('btn-right', 'right');
                this.bindTouch('btn-jump', 'jump');

                this.updateHotbar();
            }

            bindTouch(id, k) {
                const el = document.getElementById(id);
                if(!el) return;
                el.addEventListener('touchstart', (e)=>{e.preventDefault();this.inputState[k]=true;});
                el.addEventListener('touchend', (e)=>{e.preventDefault();this.inputState[k]=false;});
                el.addEventListener('mousedown', ()=>{this.inputState[k]=true;});
                el.addEventListener('mouseup', ()=>{this.inputState[k]=false;});
            }

            toggleCrafting(show) {
                document.getElementById('crafting-modal').style.display = show ? 'block' : 'none';
            }

            craftItem(item) {
                if (item === 'wooden_pickaxe' && (this.inventory[4]||0) >= 3) {
                    this.inventory[4] -= 3; alert('나무 곡괭이 제작 성공!');
                } else if (item === 'stone_pickaxe' && (this.inventory[3]||0) >= 3) {
                    this.inventory[3] -= 3; alert('돌 곡괭이 제작 성공!');
                } else {
                    alert('재료가 부족합니다!');
                }
                this.updateHotbar();
                this.toggleCrafting(false);
            }

            updateModeUI() {
                const el = document.getElementById('mode-text');
                if (this.currentMode === 'destroy') {
                    el.innerText = '모드: [부수기]'; el.style.color = '#ff5555';
                } else {
                    el.innerText = `모드: [설치 - ${this.blockNames[this.selectedBlock]}]`; el.style.color = '#55ff55';
                }
            }

            updateHotbar() {
                const hotbar = document.getElementById('hotbar');
                hotbar.innerHTML = '';
                [1, 3, 4, 6, 7, 8, 9, 12].forEach(id => {
                    const slot = document.createElement('div');
                    slot.className = `slot ${id === this.selectedBlock && this.currentMode==='place' ? 'selected' : ''}`;
                    slot.innerHTML = `<span>${this.blockNames[id]}</span><span class="count">${this.inventory[id] || 0}</span>`;
                    slot.onclick = () => { this.selectedBlock = id; this.currentMode = 'place'; this.updateModeUI(); this.updateHotbar(); };
                    hotbar.appendChild(slot);
                });
            }

            performAction() {
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(0,0), this.camera);
                const hits = ray.intersectObjects(this.blockGroup.children);
                if (hits.length > 0 && hits[0].distance < 7) {
                    const hit = hits[0];
                    let key = '', type = 0;
                    if (this.currentMode === 'destroy') {
                        const p = hit.object.position;
                        key = `${p.x},${p.y},${p.z}`;
                        const bId = this.worldMap.get(key);
                        if (bId) this.inventory[bId] = (this.inventory[bId]||0) + 1;
                        this.setBlock(p.x, p.y, p.z, 0);
                    } else {
                        if ((this.inventory[this.selectedBlock]||0) > 0) {
                            const p = hit.object.position.clone().add(hit.face.normal);
                            key = `${p.x},${p.y},${p.z}`;
                            this.setBlock(p.x, p.y, p.z, this.selectedBlock);
                            this.inventory[this.selectedBlock]--;
                            type = this.selectedBlock;
                        } else {
                            alert('블록 수량이 부족합니다!'); return;
                        }
                    }
                    this.updateHotbar();
                    this.broadcast({ type: 'block', key: key, blockType: type });
                }
            }

            checkCollision(x, y, z) {
                const r = 0.28, h = 1.6;
                for(let bx = Math.floor(x-r); bx <= Math.floor(x+r); bx++) {
                    for(let by = Math.floor(y-h+0.1); by <= Math.floor(y-0.1); by++) {
                        for(let bz = Math.floor(z-r); bz <= Math.floor(z+r); bz++) {
                            if (this.worldMap.has(`${bx},${by},${bz}`)) return true;
                        }
                    }
                }
                return false;
            }

            startLoop() {
                let lastTime = performance.now();
                let lastNetSend = 0;

                const animate = () => {
                    requestAnimationFrame(animate);
                    const now = performance.now();
                    const delta = (now - lastTime) / 1000;
                    lastTime = now;

                    // 플레이어 이동 및 물리
                    const speed = 7;
                    const sin = Math.sin(this.camera.rotation.y), cos = Math.cos(this.camera.rotation.y);
                    let tx = 0, tz = 0;
                    if (this.inputState.forward) { tx -= sin; tz -= cos; }
                    if (this.inputState.backward) { tx += sin; tz += cos; }
                    if (this.inputState.left) { tx -= cos; tz += sin; }
                    if (this.inputState.right) { tx += cos; tz -= sin; }

                    if (tx !== 0 || tz !== 0) {
                        const len = Math.sqrt(tx*tx + tz*tz);
                        tx = (tx/len)*speed; tz = (tz/len)*speed;
                    }

                    this.velocity.x += (tx - this.velocity.x) * 0.15;
                    this.velocity.z += (tz - this.velocity.z) * 0.15;
                    this.velocity.y -= 25 * 0.016;

                    if (this.inputState.jump && this.canJump) {
                        this.velocity.y = 8.5; this.canJump = false;
                    }

                    const nx = this.camera.position.x + this.velocity.x * 0.016;
                    if (!this.checkCollision(nx, this.camera.position.y, this.camera.position.z)) this.camera.position.x = nx; else this.velocity.x = 0;

                    const nz = this.camera.position.z + this.velocity.z * 0.016;
                    if (!this.checkCollision(this.camera.position.x, this.camera.position.y, nz)) this.camera.position.z = nz; else this.velocity.z = 0;

                    const ny = this.camera.position.y + this.velocity.y * 0.016;
                    if (!this.checkCollision(this.camera.position.x, ny, this.camera.position.z)) {
                        this.camera.position.y = ny; this.canJump = false;
                    } else {
                        if (this.velocity.y < 0) this.canJump = true;
                        this.velocity.y = 0;
                    }

                    if (this.camera.position.y < -35) {
                        this.camera.position.set(0, 30, 0); this.velocity.set(0,0,0);
                    }

                    document.getElementById('pos').innerText = `XYZ: ${Math.floor(this.camera.position.x)}, ${Math.floor(this.camera.position.y)}, ${Math.floor(this.camera.position.z)}`;

                    // 네트워킹 주기적 송신
                    if (performance.now() - lastNetSend > 40 && this.peer && this.myId) {
                        const nick = document.getElementById('nickname-input').value.trim() || '스티브';
                        this.broadcast({
                            type: 'move', id: this.myId, nickname: nick,
                            x: this.camera.position.x, y: this.camera.position.y - 1.2, z: this.camera.position.z,
                            ry: this.camera.rotation.y
                        });
                        lastNetSend = performance.now();
                    }

                    this.renderer.render(this.scene, this.camera);
                };

                animate();
            }
        }

        // 앱 실행
        const gameApp = new MinecraftProApp();
    </script>
</body>
