<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>웹 마인크래프트 멀티 & 속도 개선</title>
    
    <!-- 구글 애드센스 스크립트 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2157167042014574"
         crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none;
            background-color: #000; touch-action: none;
        }
        #canvas { width: 100%; height: 100%; display: block; }
        
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box;
        }
        #hud { color: white; text-shadow: 1px 1px 2px black; font-size: 13px; line-height: 1.4; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background-color: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #hotbar {
            display: flex; justify-content: center; gap: 4px; background: rgba(0,0,0,0.6);
            padding: 6px; border-radius: 8px; pointer-events: auto; align-self: center; border: 2px solid rgba(255,255,255,0.2);
        }
        .slot {
            width: 44px; height: 44px; background: rgba(0,0,0,0.5); border: 2px solid #444;
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer; color: white; font-size: 11px; font-weight: bold; text-align: center;
        }
        .slot.selected { border-color: #55ff55; background: rgba(255,255,255,0.3); }

        /* 터치 / 패드 조작용 UI 컨트롤러 */
        .touch-btn {
            pointer-events: auto; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.4);
            color: white; border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        .touch-btn:active { background: rgba(255,255,255,0.4); }

        #dpad {
            position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px;
            pointer-events: auto; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px;
        }
        #action-btns {
            position: absolute; bottom: 25px; right: 20px; display: flex; gap: 12px; pointer-events: auto;
        }
        .act-btn { width: 55px; height: 55px; border-radius: 12px; font-size: 12px; }

        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; pointer-events: auto; text-align: center; z-index: 10;
        }
        #menu h1 { font-size: 2.2rem; color: #55ff55; margin-bottom: 15px; text-shadow: 2px 2px #00aa00; }
        .menu-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 12px; width: 290px; }
        input[type="text"] { width: 80%; padding: 8px; font-size: 15px; border-radius: 4px; border: none; margin-bottom: 8px; text-align: center; }
        button { padding: 9px 18px; font-size: 14px; border: none; border-radius: 4px; background: #55ff55; color: #000; font-weight: bold; cursor: pointer; }
        button.danger { background: #ff4444; color: white; margin-top: 5px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <div id="hud">
            <div id="status" style="color: #ffaa00; font-weight: bold;">대기 중...</div>
            <div id="pos">XYZ: 0, 0, 0</div>
            <div id="online">연결 상태: 오프라인</div>
            <div id="save-status" style="color:#55ff55;">맵 자동 저장 중</div>
        </div>
        
        <div id="hotbar"></div>
    </div>
    
    <div id="crosshair"></div>

    <!-- 터치/패드 컨트롤러 -->
    <div id="dpad">
        <div></div><button class="touch-btn" id="btn-up">▲</button><div></div>
        <button class="touch-btn" id="btn-left">◀</button><div></div><button class="touch-btn" id="btn-right">▶</button>
        <div></div><button class="touch-btn" id="btn-down">▼</button><div></div>
    </div>

    <div id="action-btns">
        <button class="touch-btn act-btn" id="btn-destroy" style="background: rgba(255, 50, 50, 0.6);">부수기</button>
        <button class="touch-btn act-btn" id="btn-place" style="background: rgba(50, 200, 50, 0.6);">설치</button>
        <button class="touch-btn act-btn" id="btn-jump" style="background: rgba(50, 150, 255, 0.6);">점프</button>
    </div>

    <!-- 메뉴 화면 -->
    <div id="menu">
        <h1>웹 마인크래프트</h1>
        
        <div class="menu-box">
            <h3>방 생성하기 (호스트)</h3>
            <button id="btn-create">새 방 만들기</button>
            <div id="my-room-id" style="margin-top: 8px; font-size: 13px; color: #55ff55; word-break: break-all;"></div>
        </div>

        <div class="menu-box">
            <h3>방 참가하기 (게스트)</h3>
            <input type="text" id="join-room-id" placeholder="방 ID 입력">
            <button id="btn-join">방 참가</button>
        </div>

        <div>
            <button id="btn-start" style="background:#00aaff; color:white; margin-bottom: 5px;">게임 시작 / 닫기</button><br>
            <button id="btn-reset-map" class="danger">맵 전체 리셋 (초기화)</button>
        </div>
    </div>

    <!-- Three.js 및 PeerJS 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        function createTex(c1, c2) {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = c1; ctx.fillRect(0, 0, 32, 32);
            for(let i=0; i<60; i++) {
                ctx.fillStyle = c2;
                ctx.fillRect(Math.random()*32, Math.random()*32, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        const materials = {
            1: new THREE.MeshLambertMaterial({ map: createTex('#55a035', '#4b902e') }), // 잔디
            2: new THREE.MeshLambertMaterial({ map: createTex('#8B5A2B', '#6e4420') }), // 흙
            3: new THREE.MeshLambertMaterial({ map: createTex('#808080', '#505050') }), // 돌
            4: new THREE.MeshLambertMaterial({ map: createTex('#5c3a21', '#3f2615') }), // 원목
            5: new THREE.MeshLambertMaterial({ map: createTex('#2d6d1e', '#245617') }), // 나뭇잎
        };

        const blockNames = { 1: '잔디', 2: '흙', 3: '돌', 4: '원목', 5: '나뭇잎' };
        const SAVE_KEY = 'MINECRAFT_WORLD_DATA_V2';

        function saveWorldLocally() {
            const arr = Array.from(world.entries());
            localStorage.setItem(SAVE_KEY, JSON.stringify(arr));
            const status = document.getElementById('save-status');
            status.innerText = '맵 저장됨 (' + new Date().toLocaleTimeString() + ')';
        }

        function loadWorldLocally() {
            const data = localStorage.getItem(SAVE_KEY);
            if (data) {
                try { return new Map(JSON.parse(data)); } catch(e) {}
            }
            return null;
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(30, 60, 30);
        scene.add(sun);

        let world = loadWorldLocally();
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blockGroup = new THREE.Group();
        scene.add(blockGroup);

        if (!world) {
            world = new Map();
            generateTerrain();
        }

        function generateTerrain() {
            const MAP_SIZE = 24;
            for(let x=-MAP_SIZE; x<=MAP_SIZE; x++) {
                for(let z=-MAP_SIZE; z<=MAP_SIZE; z++) {
                    const h = Math.floor(Math.sin(x * 0.2) * Math.cos(z * 0.2) * 3 + Math.sin(x*0.1) * 2 + 3);
                    for(let y=-5; y<=h; y++) {
                        let type = 3;
                        if (y === h) type = 1;
                        else if (y >= h-2) type = 2;
                        world.set(`${x},${y},${z}`, type);
                    }
                    if (Math.random() < 0.02 && Math.abs(x) < MAP_SIZE-2 && Math.abs(z) < MAP_SIZE-2) {
                        createTree(x, h + 1, z);
                    }
                }
            }
            saveWorldLocally();
        }

        function createTree(tx, ty, tz) {
            for(let i=0; i<4; i++) world.set(`${tx},${ty+i},${tz}`, 4);
            for(let lx=-1; lx<=1; lx++) {
                for(let lz=-1; lz<=1; lz++) {
                    for(let ly=2; ly<=4; ly++) {
                        if (lx===0 && lz===0 && ly<4) continue;
                        world.set(`${tx+lx},${ty+ly},${tz+lz}`, 5);
                    }
                }
            }
        }

        function renderWorld() {
            while(blockGroup.children.length > 0) blockGroup.remove(blockGroup.children[0]);
            world.forEach((id, key) => {
                const [x, y, z] = key.split(',').map(Number);
                const mesh = new THREE.Mesh(boxGeo, materials[id]);
                mesh.position.set(x, y, z);
                blockGroup.add(mesh);
            });
        }
        renderWorld();

        let peer = null, connections = [], isHost = false, myId = '';
        const statusEl = document.getElementById('status');
        const onlineEl = document.getElementById('online');
        const menuEl = document.getElementById('menu');

        function initPeer() {
            peer = new Peer();
            peer.on('open', id => myId = id);
            peer.on('connection', conn => setupConnection(conn));
        }

        function setupConnection(conn) {
            connections.push(conn);
            onlineEl.innerText = `접속자: ${connections.length + 1}명`;
            statusEl.innerText = '멀티플레이 연동 성공!';

            conn.on('data', data => handleNetData(data));
            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                onlineEl.innerText = `접속자: ${connections.length + 1}명`;
            });

            if (isHost) conn.send({ type: 'syncWorld', world: Array.from(world.entries()) });
        }

        function broadcast(data) { connections.forEach(c => c.send(data)); }

        function handleNetData(data) {
            if (data.type === 'move') {
                updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry);
            } else if (data.type === 'block') {
                if (data.blockType === 0) world.delete(data.key);
                else world.set(data.key, data.blockType);
                renderWorld();
                saveWorldLocally();
                if (isHost) broadcast(data);
            } else if (data.type === 'syncWorld') {
                world = new Map(data.world);
                renderWorld();
                saveWorldLocally();
            }
        }

        document.getElementById('btn-create').onclick = () => {
            if (!peer) initPeer();
            isHost = true;
            setTimeout(() => {
                if(myId) {
                    document.getElementById('my-room-id').innerText = `내 방 ID: ${myId}`;
                    statusEl.innerText = '방 생성 완료!';
                }
            }, 800);
        };

        document.getElementById('btn-join').onclick = () => {
            const tid = document.getElementById('join-room-id').value.trim();
            if (!tid) return alert('방 ID를 입력하세요');
            if (!peer) peer = new Peer();
            setTimeout(() => {
                const conn = peer.connect(tid);
                conn.on('open', () => {
                    setupConnection(conn);
                    statusEl.innerText = '참가 완료!';
                });
            }, 800);
        };

        document.getElementById('btn-start').onclick = () => menuEl.style.display = 'none';
        
        document.getElementById('btn-reset-map').onclick = () => {
            if (confirm('정말로 맵을 초기화하시겠습니까?')) {
                localStorage.removeItem(SAVE_KEY);
                world = new Map();
                generateTerrain();
                renderWorld();
                alert('맵이 초기화되었습니다.');
            }
        };

        const otherPlayers = {};
        const playerMeshGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
        const playerMeshMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });

        function updateOtherPlayer(id, x, y, z, ry) {
            if (!otherPlayers[id]) {
                const m = new THREE.Mesh(playerMeshGeo, playerMeshMat);
                scene.add(m);
                otherPlayers[id] = m;
            }
            otherPlayers[id].position.set(x, y, z);
            otherPlayers[id].rotation.y = ry;
        }

        const inputState = { forward: false, backward: false, left: false, right: false, jump: false, sprint: false };
        let selectedBlock = 1;

        function bindTouch(btnId, keyName) {
            const el = document.getElementById(btnId);
            const start = (e) => { e.preventDefault(); inputState[keyName] = true; };
            const end = (e) => { e.preventDefault(); inputState[keyName] = false; };
            el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
        }

        bindTouch('btn-up', 'forward');
        bindTouch('btn-down', 'backward');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'jump');

        document.getElementById('btn-destroy').onclick = () => performBlockAction(0);
        document.getElementById('btn-place').onclick = () => performBlockAction(selectedBlock);

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyW') inputState.forward = true;
            if (e.code === 'KeyS') inputState.backward = true;
            if (e.code === 'KeyA') inputState.left = true;
            if (e.code === 'KeyD') inputState.right = true;
            if (e.code === 'Space') inputState.jump = true;
            if (e.code === 'ShiftLeft') inputState.sprint = true;

            if (e.key >= '1' && e.key <= '5') {
                selectedBlock = parseInt(e.key);
                updateHotbar();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'KeyW') inputState.forward = false;
            if (e.code === 'KeyS') inputState.backward = false;
            if (e.code === 'KeyA') inputState.left = false;
            if (e.code === 'KeyD') inputState.right = false;
            if (e.code === 'Space') inputState.jump = false;
            if (e.code === 'ShiftLeft') inputState.sprint = false;
        });

        // 화면 터치 드래그 회전 속도 향상
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', e => {
            if (e.touches.length > 0 && e.target.tagName === 'CANVAS') {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', e => {
            if (e.touches.length > 0 && e.target.tagName === 'CANVAS') {
                const dx = e.touches[0].clientX - touchStartX;
                const dy = e.touches[0].clientY - touchStartY;
                camera.rotation.y -= dx * 0.008; // 감도 대폭 증가
                camera.rotation.x -= dy * 0.008;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        });

        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.003;
                camera.rotation.x -= e.movementY * 0.003;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

        const raycaster = new THREE.Raycaster();
        function performBlockAction(type) {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(blockGroup.children);
            if (hits.length > 0 && hits[0].distance < 7) {
                const hit = hits[0];
                let key = '';
                if (type === 0) {
                    const p = hit.object.position;
                    key = `${p.x},${p.y},${p.z}`;
                    world.delete(key);
                } else {
                    const p = hit.object.position.clone().add(hit.face.normal);
                    key = `${p.x},${p.y},${p.z}`;
                    world.set(key, type);
                }
                renderWorld();
                saveWorldLocally();
                broadcast({ type: 'block', key: key, blockType: type });
            }
        }

        window.addEventListener('mousedown', e => {
            if (document.pointerLockElement === document.body) {
                if (e.button === 0) performBlockAction(0);
                if (e.button === 2) performBlockAction(selectedBlock);
            }
        });
        window.oncontextmenu = e => e.preventDefault();

        const hotbar = document.getElementById('hotbar');
        function updateHotbar() {
            hotbar.innerHTML = '';
            [1, 2, 3, 4, 5].forEach(id => {
                const slot = document.createElement('div');
                slot.className = `slot ${id === selectedBlock ? 'selected' : ''}`;
                slot.innerText = blockNames[id];
                slot.onclick = () => { selectedBlock = id; updateHotbar(); };
                hotbar.appendChild(slot);
            });
        }
        updateHotbar();

        function checkCollision(x, y, z) {
            const playerRadius = 0.3;
            const playerHeight = 1.6;

            const minX = Math.floor(x - playerRadius);
            const maxX = Math.floor(x + playerRadius);
            const minY = Math.floor(y - playerHeight);
            const maxY = Math.floor(y);
            const minZ = Math.floor(z - playerRadius);
            const maxZ = Math.floor(z + playerRadius);

            for(let bx = minX; bx <= maxX; bx++) {
                for(let by = minY; by <= maxY; by++) {
                    for(let bz = minZ; bz <= maxZ; bz++) {
                        if (world.has(`${bx},${by},${bz}`)) return true;
                    }
                }
            }
            return false;
        }

        let velocity = new THREE.Vector3();
        let canJump = false;
        let lastSendTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            velocity.x -= velocity.x * 10 * 0.016;
            velocity.z -= velocity.z * 10 * 0.016;
            velocity.y -= 25 * 0.016; // 중력

            // 이동 속도 2.5배 증가 (달리기 시 1.5배 추가 증가)
            const speedMultiplier = inputState.sprint ? 18 : 12;
            const sin = Math.sin(camera.rotation.y);
            const cos = Math.cos(camera.rotation.y);

            let dx = 0, dz = 0;
            if (inputState.forward) { dx -= sin; dz -= cos; }
            if (inputState.backward) { dx += sin; dz += cos; }
            if (inputState.left) { dx -= cos; dz += sin; }
            if (inputState.right) { dx += cos; dz -= sin; }

            if (dx !== 0 || dz !== 0) {
                const len = Math.sqrt(dx*dx + dz*dz);
                velocity.x = (dx / len) * speedMultiplier;
                velocity.z = (dz / len) * speedMultiplier;
            }

            if (inputState.jump && canJump) {
                velocity.y = 9.5; // 점프력 대폭 향상
                canJump = false;
            }

            // X축 이동 & 충돌
            const nextX = camera.position.x + velocity.x * 0.016;
            if (!checkCollision(nextX, camera.position.y, camera.position.z)) {
                camera.position.x = nextX;
            }

            // Z축 이동 & 충돌
            const nextZ = camera.position.z + velocity.z * 0.016;
            if (!checkCollision(camera.position.x, camera.position.y, nextZ)) {
                camera.position.z = nextZ;
            }

            // Y축 이동 & 충돌
            const nextY = camera.position.y + velocity.y * 0.016;
            if (!checkCollision(camera.position.x, nextY, camera.position.z)) {
                camera.position.y = nextY;
                canJump = false;
            } else {
                if (velocity.y < 0) canJump = true;
                velocity.y = 0;
            }

            if (camera.position.y < -15) {
                camera.position.set(0, 15, 0);
                velocity.set(0, 0, 0);
            }

            document.getElementById('pos').innerText = `XYZ: ${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}`;

            if (performance.now() - lastSendTime > 50) {
                broadcast({
                    type: 'move', id: myId,
                    x: camera.position.x, y: camera.position.y - 1, z: camera.position.z,
                    ry: camera.rotation.y
                });
                lastSendTime = performance.now();
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
