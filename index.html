<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>3D Minecraft Sandbox Multiplayer</title>
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2157167042014574" crossorigin="anonymous"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- PeerJS for Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
        }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 16px; height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
        
        .hotbar-slot {
            width: 44px; height: 44px;
            border: 3px solid #4a4a4a;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 0 5px #000;
            transition: transform 0.1s, border-color 0.1s;
        }
        .hotbar-slot.active {
            border-color: #ffffff;
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        #joystick-container {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
            display: none;
            z-index: 20;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        #touch-look-area {
            position: absolute; top: 0; right: 0;
            width: 60%; height: 100%;
            z-index: 5;
            display: none;
        }
        .mobile-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white; font-weight: bold;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            user-select: none; touch-action: manipulation;
        }
        .mobile-btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.95); }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <div id="crosshair"></div>

    <!-- Lobby & Settings Overlay -->
    <div id="instructions" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/85 text-white p-6 text-center backdrop-blur-sm overflow-y-auto">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-2 tracking-wider text-green-400">3D CRAFT MULTIPLAYER</h1>
        <p class="text-sm md:text-base mb-6 text-gray-300">친구와 같은 월드에서 함께 놀아보세요!</p>
        
        <div class="bg-gray-900/90 p-4 rounded-xl border border-gray-700 mb-6 max-w-md w-full text-left shadow-xl">
            <h3 class="font-bold text-yellow-400 mb-2 text-sm">🌐 멀티플레이 설정</h3>
            <div class="mb-3">
                <label class="block text-xs text-gray-400 mb-1">내 방 코드</label>
                <div class="flex gap-2">
                    <input type="text" id="my-peer-id" readonly class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-xs text-white w-full select-all font-mono" placeholder="생성 중...">
                    <button id="btn-copy-id" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-xs font-bold transition">복사</button>
                </div>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">친구 방 코드 입력</label>
                <div class="flex gap-2">
                    <input type="text" id="friend-peer-id" class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-xs text-white w-full font-mono" placeholder="친구 코드 붙여넣기">
                    <button id="btn-connect" class="bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded text-xs font-bold transition">접속</button>
                </div>
            </div>
            <p id="connection-status" class="text-xs text-cyan-400 mt-2 font-semibold">상태: 서버 연결 대기 중...</p>
        </div>

        <button id="btn-start-game" class="bg-green-500 hover:bg-green-400 text-black font-extrabold text-lg px-8 py-3 rounded-xl shadow-lg transition transform hover:scale-105 mb-6 cursor-pointer">
            게임 시작하기
        </button>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-xl text-left bg-gray-900/80 p-4 rounded-xl border border-gray-700 text-xs text-gray-300">
            <div>
                <span class="text-yellow-400 font-bold">💻 PC 조작:</span> WASD 이동, Shift 앉기, Space 점프, 좌클릭 파괴, 우클릭 설치
            </div>
            <div>
                <span class="text-yellow-400 font-bold">📱 모바일 조작:</span> 좌측 패드 이동, 우측 화면 시점 회전, 우측 전용 버튼 사용
            </div>
        </div>
    </div>

    <!-- Hotbar UI -->
    <div id="hotbar" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex gap-1.5 bg-gray-900/90 p-2 rounded-xl border border-gray-700"></div>

    <div id="touch-look-area"></div>
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <!-- Mobile Control Buttons -->
    <div id="mobile-controls" class="absolute right-4 bottom-4 z-20 flex flex-col items-end gap-2.5 hidden pointer-events-none">
        <div class="flex gap-2 pointer-events-auto">
            <button id="btn-crouch" class="mobile-btn w-12 h-12 text-xs bg-gray-800/80">앉기</button>
            <button id="btn-destroy" class="mobile-btn w-14 h-14 text-sm bg-red-600/80">파괴</button>
        </div>
        <div class="flex gap-2 pointer-events-auto">
            <button id="btn-place" class="mobile-btn w-14 h-14 text-sm bg-green-600/80">생성</button>
            <button id="btn-jump" class="mobile-btn w-14 h-14 text-sm bg-blue-600/80">점프</button>
        </div>
    </div>

    <script>
        // --- PeerJS Multiplayer ---
        let peer = null;
        let connections = {};
        let myId = '';
        const remotePlayers = {};

        function initPeer() {
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                document.getElementById('my-peer-id').value = id;
                document.getElementById('connection-status').innerText = '상태: 준비 완료 (친구에게 코드를 전달하세요)';
            });

            peer.on('connection', (conn) => {
                setupConnection(conn);
            });
        }

        function setupConnection(conn) {
            connections[conn.peer] = conn;
            document.getElementById('connection-status').innerText = `상태: 친구 접속됨!`;

            conn.on('data', (data) => {
                handleNetworkData(conn.peer, data);
            });

            conn.on('close', () => {
                if (remotePlayers[conn.peer]) {
                    scene.remove(remotePlayers[conn.peer].mesh);
                    delete remotePlayers[conn.peer];
                }
                delete connections[conn.peer];
                document.getElementById('connection-status').innerText = '상태: 친구 접속 해제됨';
            });
        }

        function connectToFriend(friendId) {
            if (!friendId || friendId === myId) return;
            const conn = peer.connect(friendId);
            conn.on('open', () => {
                setupConnection(conn);
                document.getElementById('connection-status').innerText = `상태: 친구 방 접속 완료!`;
            });
        }

        function broadcastData(data) {
            for (let id in connections) {
                if (connections[id] && connections[id].open) {
                    connections[id].send(data);
                }
            }
        }

        function handleNetworkData(peerId, data) {
            if (data.type === 'pos') {
                if (!remotePlayers[peerId]) {
                    // Create visual player avatar for friends (Red/Orange box character)
                    const group = new THREE.Group();
                    const bodyGeo = new THREE.BoxGeometry(0.6, 1.4, 0.4);
                    const headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                    const mat = new THREE.MeshLambertMaterial({ color: 0xff5722 });
                    
                    const body = new THREE.Mesh(bodyGeo, mat);
                    const head = new THREE.Mesh(headGeo, mat);
                    head.position.y = 0.9;
                    
                    group.add(body);
                    group.add(head);
                    scene.add(group);
                    
                    remotePlayers[peerId] = { mesh: group };
                }
                remotePlayers[peerId].mesh.position.set(data.x, data.y - 0.7, data.z);
                remotePlayers[peerId].mesh.rotation.y = data.ry;
            } else if (data.type === 'block_break') {
                removeBlockServer(data.x, data.y, data.z);
            } else if (data.type === 'block_place') {
                createBlockServer(data.x, data.y, data.z, data.typeId);
            }
        }

        document.getElementById('btn-copy-id').addEventListener('click', (e) => {
            e.stopPropagation();
            const input = document.getElementById('my-peer-id');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('방 코드가 복사되었습니다!');
        });

        document.getElementById('btn-connect').addEventListener('click', (e) => {
            e.stopPropagation();
            const fId = document.getElementById('friend-peer-id').value.trim();
            if (fId) connectToFriend(fId);
        });

        // --- Simplex Noise ---
        class SimplexNoise {
            constructor() {
                this.p = new Uint8Array(256);
                for (let i = 0; i < 256; i++) this.p[i] = Math.floor(Math.random() * 256);
                this.perm = new Uint8Array(512);
                for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
            }
            noise2D(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                return (this.perm[X + this.perm[Y]] % 100) / 100.0;
            }
        }
        const simplex = new SimplexNoise();

        // --- Block Definitions (Correct Colors) ---
        const BLOCK_TYPES = {
            GRASS: { id: 1, name: '잔디', color: '#557a2b', topColor: '#4CAF50' }, // Vibrant Green Grass Top
            DIRT: { id: 2, name: '흙', color: '#684a23' },
            STONE: { id: 3, name: '돌', color: '#808080' }, // True Grey Stone
            SAND: { id: 4, name: '모래', color: '#d6c585' },
            WOOD: { id: 5, name: '나무', color: '#5c4018' },
            LEAVES: { id: 6, name: '나뭇잎', color: '#2e7d32' },
            SWORD: { id: 12, name: '철 검 (무기)', color: '#c0c0c0', isTool: true },
            PICKAXE: { id: 13, name: '철 곡괭이', color: '#9e9e9e', isTool: true }
        };

        const inventory = { 1: 40, 2: 40, 3: 40, 4: 20, 5: 20, 6: 20, 12: 1, 13: 1 };
        const SELECTABLE_ITEMS = [
            BLOCK_TYPES.GRASS, BLOCK_TYPES.DIRT, BLOCK_TYPES.STONE, BLOCK_TYPES.SAND,
            BLOCK_TYPES.WOOD, BLOCK_TYPES.LEAVES, BLOCK_TYPES.SWORD, BLOCK_TYPES.PICKAXE
        ];
        let selectedItemIndex = 0;

        function createTextures() {
            const mats = {};
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');

            function getTex(colorStr) {
                ctx.fillStyle = colorStr;
                ctx.fillRect(0, 0, 32, 32);
                for (let x = 0; x < 32; x += 4) {
                    for (let y = 0; y < 32; y += 4) {
                        if (Math.random() > 0.5) {
                            ctx.fillStyle = 'rgba(0,0,0,0.1)';
                            ctx.fillRect(x, y, 4, 4);
                        }
                    }
                }
                const t = new THREE.CanvasTexture(canvas);
                t.magFilter = THREE.NearestFilter;
                return t;
            }

            const dirtTex = getTex(BLOCK_TYPES.DIRT.color);
            const grassTopTex = getTex(BLOCK_TYPES.GRASS.topColor);
            const stoneTex = getTex(BLOCK_TYPES.STONE.color);
            const sandTex = getTex(BLOCK_TYPES.SAND.color);
            const woodTex = getTex(BLOCK_TYPES.WOOD.color);
            const leafTex = getTex(BLOCK_TYPES.LEAVES.color);

            // Grass Block Material Assembly
            mats[BLOCK_TYPES.GRASS.id] = [
                new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: grassTopTex }),
                new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: dirtTex })
            ];
            mats[BLOCK_TYPES.DIRT.id] = new THREE.MeshLambertMaterial({ map: dirtTex });
            mats[BLOCK_TYPES.STONE.id] = new THREE.MeshLambertMaterial({ map: stoneTex });
            mats[BLOCK_TYPES.SAND.id] = new THREE.MeshLambertMaterial({ map: sandTex });
            mats[BLOCK_TYPES.WOOD.id] = new THREE.MeshLambertMaterial({ map: woodTex });
            mats[BLOCK_TYPES.LEAVES.id] = new THREE.MeshLambertMaterial({ map: leafTex, transparent: true, opacity: 0.85 });

            return mats;
        }

        const WORLD_SIZE = 32;

        let scene, camera, renderer;
        let blockMaterials;
        const blocksMap = new Map();
        const blockTypeMap = new Map();

        const player = {
            position: new THREE.Vector3(0, 20, 0),
            velocity: new THREE.Vector3(),
            height: 1.6,
            crouchHeight: 1.1,
            isCrouching: false,
            radius: 0.3,
            onGround: false
        };

        const keys = {};
        let isTouchDevice = false;
        let pointerLocked = false;
        let touchLookId = null;
        let lastTouchX = 0, lastTouchY = 0;
        const joystick = { active: false, id: null, startX: 0, startY: 0, deltaX: 0, deltaY: 0 };

        const raycaster = new THREE.Raycaster();
        let wireframeBox;

        function init() {
            isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            initPeer();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            blockMaterials = createTextures();

            const wireframeGeo = new THREE.BoxGeometry(1.005, 1.005, 1.005);
            wireframeBox = new THREE.LineSegments(new THREE.EdgesGeometry(wireframeGeo), new THREE.LineBasicMaterial({ color: 0x000000 }));
            wireframeBox.visible = false;
            scene.add(wireframeBox);

            setupHotbar();
            generateWorld();

            const h = getTerrainHeight(0, 0);
            player.position.set(0, h + 2.0, 0);

            setupEventListeners();
            if (isTouchDevice) setupMobileControls();

            document.getElementById('btn-start-game').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('instructions').style.display = 'none';
                if (!isTouchDevice) renderer.domElement.requestPointerLock();
            });

            animate();
        }

        function getTerrainHeight(x, z) {
            const n = simplex.noise2D(x * 0.08, z * 0.08);
            return Math.floor(n * 4 + 8);
        }

        function generateWorld() {
            const half = Math.floor(WORLD_SIZE / 2);
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);

            for (let x = -half; x < half; x++) {
                for (let z = -half; z < half; z++) {
                    const height = getTerrainHeight(x, z);

                    for (let y = 0; y <= height; y++) {
                        let type = null;
                        if (y === height) type = BLOCK_TYPES.GRASS;
                        else if (y > height - 3) type = BLOCK_TYPES.DIRT;
                        else type = BLOCK_TYPES.STONE;

                        if (type) createBlock(x, y, z, type, boxGeo);
                    }

                    if (Math.random() < 0.02 && Math.abs(x) > 2 && Math.abs(z) > 2) {
                        createTree(x, height + 1, z, boxGeo);
                    }
                }
            }
        }

        function createTree(x, startY, z, geometry) {
            for (let i = 0; i < 4; i++) createBlock(x, startY + i, z, BLOCK_TYPES.WOOD, geometry);
            for (let lx = x - 1; lx <= x + 1; lx++) {
                for (let lz = z - 1; lz <= z + 1; lz++) {
                    for (let ly = startY + 2; ly <= startY + 4; ly++) {
                        if (!blocksMap.has(`${lx},${ly},${lz}`)) createBlock(lx, ly, lz, BLOCK_TYPES.LEAVES, geometry);
                    }
                }
            }
        }

        function createBlock(x, y, z, type, geometry = new THREE.BoxGeometry(1, 1, 1)) {
            const key = `${x},${y},${z}`;
            if (blocksMap.has(key)) return;
            const mesh = new THREE.Mesh(geometry, blockMaterials[type.id]);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocksMap.set(key, mesh);
            blockTypeMap.set(key, type.id);
        }

        function createBlockServer(x, y, z, typeId) {
            const type = Object.values(BLOCK_TYPES).find(b => b.id === typeId);
            if (type) createBlock(x, y, z, type);
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            const mesh = blocksMap.get(key);
            if (mesh) {
                scene.remove(mesh);
                blocksMap.delete(key);
                blockTypeMap.delete(key);
                broadcastData({ type: 'block_break', x, y, z });
                return true;
            }
            return false;
        }

        function removeBlockServer(x, y, z) {
            const key = `${x},${y},${z}`;
            const mesh = blocksMap.get(key);
            if (mesh) {
                scene.remove(mesh);
                blocksMap.delete(key);
                blockTypeMap.delete(key);
            }
        }

        function setupHotbar() {
            const hotbarEl = document.getElementById('hotbar');
            hotbarEl.innerHTML = '';
            SELECTABLE_ITEMS.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = `hotbar-slot relative rounded-lg flex items-center justify-center cursor-pointer ${index === selectedItemIndex ? 'active' : ''}`;
                const icon = document.createElement('div');
                icon.className = 'w-6 h-6 rounded border border-black/40';
                icon.style.backgroundColor = item.topColor || item.color;
                const badge = document.createElement('span');
                badge.className = 'absolute bottom-0 right-1 text-[10px] font-extrabold text-white';
                badge.id = `slot-count-${item.id}`;
                badge.innerText = inventory[item.id] || 0;
                slot.appendChild(icon);
                slot.appendChild(badge);
                slot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectSlot(index);
                });
                hotbarEl.appendChild(slot);
            });
        }

        function updateHotbarUI() {
            SELECTABLE_ITEMS.forEach(item => {
                const badge = document.getElementById(`slot-count-${item.id}`);
                if (badge) badge.innerText = inventory[item.id] || 0;
            });
        }

        function selectSlot(index) {
            selectedItemIndex = index;
            document.querySelectorAll('.hotbar-slot').forEach((s, i) => {
                if (i === index) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        function setupEventListeners() {
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code.startsWith('Digit')) {
                    const num = parseInt(e.code.replace('Digit', ''));
                    if (num >= 1 && num <= SELECTABLE_ITEMS.length) selectSlot(num - 1);
                }
            });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            window.addEventListener('mousemove', (e) => {
                if (pointerLocked) {
                    camera.rotation.y -= e.movementX * 0.0025;
                    camera.rotation.x -= e.movementY * 0.0025;
                    camera.rotation.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, camera.rotation.x));
                }
            });

            window.addEventListener('mousedown', (e) => {
                if (document.getElementById('instructions').style.display !== 'none') return;
                if (e.button === 0) performAction('destroy');
                if (e.button === 2) performAction('place');
            });
            window.addEventListener('contextmenu', e => e.preventDefault());

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function setupMobileControls() {
            document.getElementById('mobile-controls').classList.remove('hidden');
            document.getElementById('joystick-container').style.display = 'block';
            document.getElementById('touch-look-area').style.display = 'block';

            const jsContainer = document.getElementById('joystick-container');
            const jsKnob = document.getElementById('joystick-knob');

            jsContainer.addEventListener('touchstart', (e) => {
                const touch = e.targetTouches[0];
                joystick.active = true;
                joystick.id = touch.identifier;
                joystick.startX = touch.clientX;
                joystick.startY = touch.clientY;
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!joystick.active) return;
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystick.id) {
                        let dx = touch.clientX - joystick.startX;
                        let dy = touch.clientY - joystick.startY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 35;
                        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                        jsKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystick.deltaX = dx / maxDist;
                        joystick.deltaY = dy / maxDist;
                    }
                }
            }, { passive: false });

            const resetJs = (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystick.id) {
                        joystick.active = false;
                        joystick.deltaX = 0; joystick.deltaY = 0;
                        jsKnob.style.transform = `translate(0px, 0px)`;
                    }
                }
            };
            window.addEventListener('touchend', resetJs);
            window.addEventListener('touchcancel', resetJs);

            const lookArea = document.getElementById('touch-look-area');
            lookArea.addEventListener('touchstart', (e) => {
                const touch = e.targetTouches[0];
                touchLookId = touch.identifier;
                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            }, { passive: false });

            lookArea.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === touchLookId) {
                        const dx = touch.clientX - lastTouchX;
                        const dy = touch.clientY - lastTouchY;
                        camera.rotation.y -= dx * 0.005;
                        camera.rotation.x -= dy * 0.005;
                        camera.rotation.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, camera.rotation.x));
                        lastTouchX = touch.clientX; lastTouchY = touch.clientY;
                    }
                }
            }, { passive: false });

            // Mobile Buttons (Prevent propagation to avoid accidental block breaking)
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); keys['Space'] = true; });
            document.getElementById('btn-jump').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); keys['Space'] = false; });
            
            document.getElementById('btn-destroy').addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); performAction('destroy'); });
            document.getElementById('btn-place').addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); performAction('place'); });

            // Fix: Separate Crouch Button Event (Do NOT break blocks)
            document.getElementById('btn-crouch').addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                player.isCrouching = !player.isCrouching;
                const btn = document.getElementById('btn-crouch');
                if (player.isCrouching) btn.classList.add('bg-yellow-600/80');
                else btn.classList.remove('bg-yellow-600/80');
            });
        }

        function performAction(action) {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blocksMap.values()));
            if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.distance > 6.0) return;
                const pos = hit.object.position;

                if (action === 'destroy') {
                    removeBlock(pos.x, pos.y, pos.z);
                } else if (action === 'place') {
                    const selectedItem = SELECTABLE_ITEMS[selectedItemIndex];
                    if (selectedItem.isTool) return;

                    const normal = hit.face.normal;
                    const tx = pos.x + normal.x;
                    const ty = pos.y + normal.y;
                    const tz = pos.z + normal.z;

                    if (!inventory[selectedItem.id] || inventory[selectedItem.id] <= 0) return;

                    createBlock(tx, ty, tz, selectedItem);
                    inventory[selectedItem.id]--;
                    updateHotbarUI();
                    broadcastData({ type: 'block_place', x: tx, y: ty, z: tz, typeId: selectedItem.id });
                }
            }
        }

        // --- Precise Solid Physics (Fix Jittering & Shaking) ---
        function checkCollision(pos, currentHeight) {
            const minX = Math.floor(pos.x - player.radius + 0.5);
            const maxX = Math.floor(pos.x + player.radius + 0.5);
            const minY = Math.floor(pos.y - currentHeight + 0.05);
            const maxY = Math.floor(pos.y + 0.1);
            const minZ = Math.floor(pos.z - player.radius + 0.5);
            const maxZ = Math.floor(pos.z + player.radius + 0.5);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (blocksMap.has(`${x},${y},${z}`)) return true;
                    }
                }
            }
            return false;
        }

        function updatePlayer(delta) {
            if (!isTouchDevice) player.isCrouching = keys['ShiftLeft'] || keys['ShiftRight'];
            const currentHeight = player.isCrouching ? player.crouchHeight : player.height;

            const moveVector = new THREE.Vector3();
            if (keys['KeyW']) moveVector.z -= 1;
            if (keys['KeyS']) moveVector.z += 1;
            if (keys['KeyA']) moveVector.x -= 1;
            if (keys['KeyD']) moveVector.x += 1;

            if (joystick.active) {
                moveVector.x = joystick.deltaX;
                moveVector.z = joystick.deltaY;
            }
            moveVector.normalize();

            const moveSpeed = player.isCrouching ? 2.5 : 5.5;
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);

            const targetVel = new THREE.Vector3()
                .addScaledVector(forward, -moveVector.z * moveSpeed)
                .addScaledVector(right, moveVector.x * moveSpeed);

            player.velocity.x = targetVel.x;
            player.velocity.z = targetVel.z;

            // Smooth Gravity
            player.velocity.y -= 22.0 * delta;
            if (keys['Space'] && player.onGround) {
                player.velocity.y = 7.5;
                player.onGround = false;
            }

            // Move Horizontal X
            const oldX = player.position.x;
            player.position.x += player.velocity.x * delta;
            if (checkCollision(player.position, currentHeight)) player.position.x = oldX;

            // Move Horizontal Z
            const oldZ = player.position.z;
            player.position.z += player.velocity.z * delta;
            if (checkCollision(player.position, currentHeight)) player.position.z = oldZ;

            // Move Vertical Y (Fix Jitter/Jump shake)
            const oldY = player.position.y;
            player.position.y += player.velocity.y * delta;
            
            if (checkCollision(player.position, currentHeight)) {
                if (player.velocity.y <= 0) {
                    player.onGround = true;
                    player.velocity.y = 0;
                    // Snap exactly to block surface height
                    const feetY = Math.floor(oldY - currentHeight + 0.05);
                    player.position.y = feetY + 1 + currentHeight;
                } else {
                    player.velocity.y = 0;
                    player.position.y = oldY;
                }
            } else {
                player.onGround = false;
            }

            // Fall Reset
            if (player.position.y < -15) {
                const h = getTerrainHeight(0, 0);
                player.position.set(0, h + 3, 0);
                player.velocity.set(0, 0, 0);
            }

            camera.position.copy(player.position);

            // Broadcast Position
            broadcastData({
                type: 'pos',
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                ry: camera.rotation.y
            });
        }

        function updateRaycastHighlight() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blocksMap.values()));
            if (intersects.length > 0 && intersects[0].distance <= 6.0) {
                wireframeBox.position.copy(intersects[0].object.position);
                wireframeBox.visible = true;
            } else {
                wireframeBox.visible = false;
            }
        }

        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (document.getElementById('instructions').style.display === 'none') {
                updatePlayer(delta);
                updateRaycastHighlight();
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
