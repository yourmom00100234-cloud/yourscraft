<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>3D Minecraft Sandbox Game</title>
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2157167042014574" crossorigin="anonymous"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
        
        .hotbar-slot {
            width: 44px;
            height: 44px;
            border: 3px solid #4a4a4a;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 0 5px #000;
            transition: transform 0.1s, border-color 0.1s;
        }
        .hotbar-slot.active {
            border-color: #ffffff;
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
            display: none;
            z-index: 20;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        #touch-look-area {
            position: absolute;
            top: 0; right: 0;
            width: 60%; height: 100%;
            z-index: 5;
            display: none;
        }
        .mobile-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }
        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }
        #underwater-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 80, 200, 0.35);
            pointer-events: none;
            display: none;
            z-index: 8;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <div id="crosshair"></div>
    <div id="underwater-overlay"></div>

    <div id="instructions" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/80 text-white p-6 text-center cursor-pointer backdrop-blur-sm">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-wider text-green-400">3D CRAFT WORLD</h1>
        <p class="text-lg md:text-xl mb-6 text-gray-200">화면을 터치하거나 클릭하여 시작하세요!</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-xl text-left bg-gray-900/90 p-5 rounded-xl border border-gray-700 text-sm">
            <div>
                <h3 class="font-bold text-yellow-400 mb-2 border-b border-gray-700 pb-1">💻 PC 조작법</h3>
                <ul class="space-y-1 text-gray-300">
                    <li>• WASD : 이동</li>
                    <li>• Shift : 앉기</li>
                    <li>• Space : 점프 / 수영</li>
                    <li>• 좌클릭 : 블록 파괴</li>
                    <li>• 우클릭 : 블록 설치</li>
                    <li>• 1-6 / 휠 : 블록 선택</li>
                </ul>
            </div>
            <div>
                <h3 class="font-bold text-yellow-400 mb-2 border-b border-gray-700 pb-1">📱 모바일 조작법</h3>
                <ul class="space-y-1 text-gray-300">
                    <li>• 좌측 패드 : 이동</li>
                    <li>• 우측 화면 : 시점 회전</li>
                    <li>• 우측 버튼 : 점프, 파괴, 설치</li>
                    <li>• 하단 슬롯 : 블록 선택</li>
                </ul>
            </div>
        </div>
        <p class="mt-8 text-xs text-gray-400 animate-pulse">클릭하면 즉시 시작됩니다!</p>
    </div>

    <!-- Hotbar -->
    <div id="hotbar" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex gap-1.5 bg-gray-900/90 p-2 rounded-xl border border-gray-700"></div>

    <div id="touch-look-area"></div>
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div id="mobile-controls" class="absolute right-4 bottom-4 z-20 flex flex-col items-end gap-2.5 hidden pointer-events-none">
        <div class="flex gap-2 pointer-events-auto">
            <button id="btn-crouch" class="mobile-btn w-12 h-12 text-xs bg-gray-800/80">앉기</button>
            <button id="btn-destroy" class="mobile-btn w-14 h-14 text-sm bg-red-600/80">파괴</button>
        </div>
        <div class="flex gap-2 pointer-events-auto">
            <button id="btn-place" class="mobile-btn w-14 h-14 text-sm bg-green-600/80">생성</button>
            <button id="btn-jump" class="mobile-btn w-14 h-14 text-sm bg-blue-600/80">점프</button>
        </div>
    </div>

    <script>
        // Simple Noise Generator
        class SimplexNoise {
            constructor() {
                this.p = new Uint8Array(256);
                for (let i = 0; i < 256; i++) this.p[i] = Math.floor(Math.random() * 256);
                this.perm = new Uint8Array(512);
                for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
            }
            noise2D(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                return (this.perm[X + this.perm[Y]] % 100) / 100.0;
            }
        }
        const simplex = new SimplexNoise();

        const BLOCK_TYPES = {
            GRASS: { id: 1, name: '잔디', color: '#557a2b', topColor: '#6db33f' },
            DIRT: { id: 2, name: '흙', color: '#684a23' },
            STONE: { id: 3, name: '돌', color: '#7d7d7d' },
            SAND: { id: 4, name: '모래', color: '#d6c585' },
            WOOD: { id: 5, name: '나무', color: '#5c4018' },
            LEAVES: { id: 6, name: '나뭇잎', color: '#2d6e32' },
            WATER: { id: 7, name: '물', color: '#1e68b8', transparent: true, opacity: 0.5 },
            COAL: { id: 8, name: '석탄', color: '#363636' },
            IRON: { id: 9, name: '철', color: '#d8af93' },
            GOLD: { id: 10, name: '금', color: '#fcd34d' },
            DIAMOND: { id: 11, name: '다이아몬드', color: '#38bdf8' }
        };

        const inventory = { 1: 30, 2: 30, 3: 30, 4: 20, 5: 15, 6: 15, 8: 10, 9: 5, 10: 2, 11: 1 };
        const SELECTABLE_BLOCKS = [
            BLOCK_TYPES.GRASS, BLOCK_TYPES.DIRT, BLOCK_TYPES.STONE, BLOCK_TYPES.SAND,
            BLOCK_TYPES.WOOD, BLOCK_TYPES.LEAVES, BLOCK_TYPES.COAL, BLOCK_TYPES.IRON,
            BLOCK_TYPES.GOLD, BLOCK_TYPES.DIAMOND
        ];
        let selectedBlockIndex = 0;

        function createTextures() {
            const mats = {};
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');

            function getTex(color, noise = 15) {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, 32, 32);
                for (let x = 0; x < 32; x += 4) {
                    for (let y = 0; y < 32; y += 4) {
                        if (Math.random() > 0.5) {
                            ctx.fillStyle = 'rgba(0,0,0,0.08)';
                            ctx.fillRect(x, y, 4, 4);
                        }
                    }
                }
                const t = new THREE.CanvasTexture(canvas);
                t.magFilter = THREE.NearestFilter;
                return t;
            }

            const dirtTex = getTex(BLOCK_TYPES.DIRT.color);
            const grassTop = getTex(BLOCK_TYPES.GRASS.topColor);
            const stoneTex = getTex(BLOCK_TYPES.STONE.color);
            const sandTex = getTex(BLOCK_TYPES.SAND.color);
            const woodTex = getTex(BLOCK_TYPES.WOOD.color);
            const leafTex = getTex(BLOCK_TYPES.LEAVES.color);
            const waterTex = getTex(BLOCK_TYPES.WATER.color);

            mats[BLOCK_TYPES.GRASS.id] = [
                new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: grassTop }),
                new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: dirtTex })
            ];
            mats[BLOCK_TYPES.DIRT.id] = new THREE.MeshLambertMaterial({ map: dirtTex });
            mats[BLOCK_TYPES.STONE.id] = new THREE.MeshLambertMaterial({ map: stoneTex });
            mats[BLOCK_TYPES.SAND.id] = new THREE.MeshLambertMaterial({ map: sandTex });
            mats[BLOCK_TYPES.WOOD.id] = new THREE.MeshLambertMaterial({ map: woodTex });
            mats[BLOCK_TYPES.LEAVES.id] = new THREE.MeshLambertMaterial({ map: leafTex, transparent: true, opacity: 0.85 });
            mats[BLOCK_TYPES.WATER.id] = new THREE.MeshLambertMaterial({ map: waterTex, transparent: true, opacity: 0.5, depthWrite: false });

            mats[BLOCK_TYPES.COAL.id] = new THREE.MeshLambertMaterial({ map: getTex('#363636') });
            mats[BLOCK_TYPES.IRON.id] = new THREE.MeshLambertMaterial({ map: getTex('#d8af93') });
            mats[BLOCK_TYPES.GOLD.id] = new THREE.MeshLambertMaterial({ map: getTex('#fcd34d') });
            mats[BLOCK_TYPES.DIAMOND.id] = new THREE.MeshLambertMaterial({ map: getTex('#38bdf8') });

            return mats;
        }

        const WORLD_SIZE = 36;
        const WATER_LEVEL = 4;

        let scene, camera, renderer;
        let blockMaterials;
        const blocksMap = new Map();
        const blockTypeMap = new Map();
        const droppedItems = [];

        const player = {
            position: new THREE.Vector3(0, 25, 0),
            velocity: new THREE.Vector3(),
            height: 1.6,
            crouchHeight: 1.2,
            isCrouching: false,
            radius: 0.3,
            onGround: false,
            inWater: false
        };

        const keys = {};
        let isTouchDevice = false;
        let pointerLocked = false;
        let touchLookId = null;
        let lastTouchX = 0, lastTouchY = 0;
        const joystick = { active: false, id: null, startX: 0, startY: 0, deltaX: 0, deltaY: 0 };

        const raycaster = new THREE.Raycaster();
        let wireframeBox;

        function init() {
            isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            blockMaterials = createTextures();

            const wireframeGeo = new THREE.BoxGeometry(1.005, 1.005, 1.005);
            wireframeBox = new THREE.LineSegments(new THREE.EdgesGeometry(wireframeGeo), new THREE.LineBasicMaterial({ color: 0x000000 }));
            wireframeBox.visible = false;
            scene.add(wireframeBox);

            setupHotbar();
            generateWorld();

            // Safe Land Spawn height calculation
            const h = getTerrainHeight(0, 0);
            player.position.set(0, h + 3, 0);

            setupEventListeners();
            if (isTouchDevice) setupMobileControls();

            animate();
        }

        // Proper heightmap formula (Grass surface at Y = 10 ~ 15)
        function getTerrainHeight(x, z) {
            const n = simplex.noise2D(x * 0.08, z * 0.08);
            return Math.floor(n * 5 + 10);
        }

        function generateWorld() {
            const half = Math.floor(WORLD_SIZE / 2);
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);

            for (let x = -half; x < half; x++) {
                for (let z = -half; z < half; z++) {
                    const height = getTerrainHeight(x, z);

                    for (let y = 0; y <= Math.max(height, WATER_LEVEL); y++) {
                        let type = null;
                        if (y <= height) {
                            if (y === height) {
                                type = BLOCK_TYPES.GRASS;
                            } else if (y > height - 3) {
                                type = BLOCK_TYPES.DIRT;
                            } else {
                                // Deep underground ores
                                const rand = Math.random();
                                if (y < 2 && rand < 0.02) type = BLOCK_TYPES.DIAMOND;
                                else if (y < 4 && rand < 0.04) type = BLOCK_TYPES.GOLD;
                                else if (y < 6 && rand < 0.08) type = BLOCK_TYPES.IRON;
                                else if (y < 8 && rand < 0.12) type = BLOCK_TYPES.COAL;
                                else type = BLOCK_TYPES.STONE;
                            }
                        } else if (y <= WATER_LEVEL) {
                            type = BLOCK_TYPES.WATER;
                        }
                        if (type) createBlock(x, y, z, type, boxGeo);
                    }

                    // Trees on grass
                    if (height > WATER_LEVEL + 1 && Math.random() < 0.025 && Math.abs(x) > 2 && Math.abs(z) > 2) {
                        createTree(x, height + 1, z, boxGeo);
                    }
                }
            }
        }

        function createTree(x, startY, z, geometry) {
            for (let i = 0; i < 4; i++) createBlock(x, startY + i, z, BLOCK_TYPES.WOOD, geometry);
            for (let lx = x - 1; lx <= x + 1; lx++) {
                for (let lz = z - 1; lz <= z + 1; lz++) {
                    for (let ly = startY + 2; ly <= startY + 4; ly++) {
                        if (!blocksMap.has(`${lx},${ly},${lz}`)) createBlock(lx, ly, lz, BLOCK_TYPES.LEAVES, geometry);
                    }
                }
            }
        }

        function createBlock(x, y, z, type, geometry = new THREE.BoxGeometry(1, 1, 1)) {
            const key = `${x},${y},${z}`;
            if (blocksMap.has(key)) return;
            const mesh = new THREE.Mesh(geometry, blockMaterials[type.id]);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocksMap.set(key, mesh);
            blockTypeMap.set(key, type.id);
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            const mesh = blocksMap.get(key);
            const typeId = blockTypeMap.get(key);
            if (typeId === BLOCK_TYPES.WATER.id) return false;
            if (mesh) {
                spawnItem(x, y, z, typeId);
                scene.remove(mesh);
                blocksMap.delete(key);
                blockTypeMap.delete(key);
                return true;
            }
            return false;
        }

        const itemGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
        function spawnItem(x, y, z, typeId) {
            const mat = Array.isArray(blockMaterials[typeId]) ? blockMaterials[typeId][0] : blockMaterials[typeId];
            const itemMesh = new THREE.Mesh(itemGeo, mat);
            itemMesh.position.set(x, y + 0.3, z);
            scene.add(itemMesh);
            droppedItems.push({ mesh: itemMesh, typeId: typeId, velocity: new THREE.Vector3(0, 2, 0), time: Date.now() });
        }

        function updateItems(delta) {
            const now = Date.now();
            for (let i = droppedItems.length - 1; i >= 0; i--) {
                const item = droppedItems[i];
                item.mesh.rotation.y += delta * 3;
                const dist = player.position.distanceTo(item.mesh.position);
                if (dist < 1.8 && (now - item.time > 300)) {
                    item.mesh.position.lerp(player.position, delta * 10);
                    if (dist < 0.6) {
                        inventory[item.typeId] = (inventory[item.typeId] || 0) + 1;
                        updateHotbarUI();
                        scene.remove(item.mesh);
                        droppedItems.splice(i, 1);
                    }
                }
            }
        }

        function setupHotbar() {
            const hotbarEl = document.getElementById('hotbar');
            hotbarEl.innerHTML = '';
            SELECTABLE_BLOCKS.forEach((block, index) => {
                const slot = document.createElement('div');
                slot.className = `hotbar-slot relative rounded-lg flex items-center justify-center cursor-pointer ${index === selectedBlockIndex ? 'active' : ''}`;
                const icon = document.createElement('div');
                icon.className = 'w-6 h-6 rounded border border-black/40';
                icon.style.backgroundColor = block.topColor || block.color;
                const badge = document.createElement('span');
                badge.className = 'absolute bottom-0 right-1 text-[10px] font-extrabold text-white';
                badge.id = `slot-count-${block.id}`;
                badge.innerText = inventory[block.id] || 0;
                slot.appendChild(icon);
                slot.appendChild(badge);
                slot.addEventListener('click', () => selectSlot(index));
                hotbarEl.appendChild(slot);
            });
        }

        function updateHotbarUI() {
            SELECTABLE_BLOCKS.forEach(block => {
                const badge = document.getElementById(`slot-count-${block.id}`);
                if (badge) badge.innerText = inventory[block.id] || 0;
            });
        }

        function selectSlot(index) {
            selectedBlockIndex = index;
            document.querySelectorAll('.hotbar-slot').forEach((s, i) => {
                if (i === index) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        function setupEventListeners() {
            const inst = document.getElementById('instructions');
            inst.addEventListener('click', () => {
                inst.style.display = 'none';
                if (!isTouchDevice) renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                pointerLocked = (document.pointerLockElement === renderer.domElement);
                if (!pointerLocked && !isTouchDevice) inst.style.display = 'flex';
            });

            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code.startsWith('Digit')) {
                    const num = parseInt(e.code.replace('Digit', ''));
                    if (num >= 1 && num <= SELECTABLE_BLOCKS.length) selectSlot(num - 1);
                }
            });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            window.addEventListener('mousemove', (e) => {
                if (pointerLocked) {
                    camera.rotation.y -= e.movementX * 0.0025;
                    camera.rotation.x -= e.movementY * 0.0025;
                    camera.rotation.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, camera.rotation.x));
                }
            });

            window.addEventListener('mousedown', (e) => {
                if (!pointerLocked) return;
                if (e.button === 0) performAction('destroy');
                if (e.button === 2) performAction('place');
            });
            window.addEventListener('contextmenu', e => e.preventDefault());

            window.addEventListener('wheel', (e) => {
                if (!pointerLocked) return;
                if (e.deltaY > 0) selectSlot((selectedBlockIndex + 1) % SELECTABLE_BLOCKS.length);
                else selectSlot((selectedBlockIndex - 1 + SELECTABLE_BLOCKS.length) % SELECTABLE_BLOCKS.length);
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function setupMobileControls() {
            document.getElementById('mobile-controls').classList.remove('hidden');
            document.getElementById('joystick-container').style.display = 'block';
            document.getElementById('touch-look-area').style.display = 'block';

            const jsContainer = document.getElementById('joystick-container');
            const jsKnob = document.getElementById('joystick-knob');

            jsContainer.addEventListener('touchstart', (e) => {
                const touch = e.targetTouches[0];
                joystick.active = true;
                joystick.id = touch.identifier;
                joystick.startX = touch.clientX;
                joystick.startY = touch.clientY;
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!joystick.active) return;
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystick.id) {
                        let dx = touch.clientX - joystick.startX;
                        let dy = touch.clientY - joystick.startY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 35;
                        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                        jsKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystick.deltaX = dx / maxDist;
                        joystick.deltaY = dy / maxDist;
                    }
                }
            }, { passive: false });

            const resetJs = (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystick.id) {
                        joystick.active = false;
                        joystick.deltaX = 0; joystick.deltaY = 0;
                        jsKnob.style.transform = `translate(0px, 0px)`;
                    }
                }
            };
            window.addEventListener('touchend', resetJs);
            window.addEventListener('touchcancel', resetJs);

            const lookArea = document.getElementById('touch-look-area');
            lookArea.addEventListener('touchstart', (e) => {
                const touch = e.targetTouches[0];
                touchLookId = touch.identifier;
                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            }, { passive: false });

            lookArea.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === touchLookId) {
                        const dx = touch.clientX - lastTouchX;
                        const dy = touch.clientY - lastTouchY;
                        camera.rotation.y -= dx * 0.005;
                        camera.rotation.x -= dy * 0.005;
                        camera.rotation.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, camera.rotation.x));
                        lastTouchX = touch.clientX; lastTouchY = touch.clientY;
                    }
                }
            }, { passive: false });

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); keys['Space'] = true; });
            document.getElementById('btn-jump').addEventListener('touchend', () => { keys['Space'] = false; });
            document.getElementById('btn-destroy').addEventListener('click', (e) => { e.preventDefault(); performAction('destroy'); });
            document.getElementById('btn-place').addEventListener('click', (e) => { e.preventDefault(); performAction('place'); });
            document.getElementById('btn-crouch').addEventListener('click', (e) => {
                e.preventDefault();
                player.isCrouching = !player.isCrouching;
                const btn = document.getElementById('btn-crouch');
                if (player.isCrouching) btn.classList.add('bg-yellow-600/80');
                else btn.classList.remove('bg-yellow-600/80');
            });
        }

        function performAction(action) {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blocksMap.values()));
            if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.distance > 6.0) return;
                const pos = hit.object.position;

                if (action === 'destroy') {
                    removeBlock(pos.x, pos.y, pos.z);
                } else if (action === 'place') {
                    const normal = hit.face.normal;
                    const tx = pos.x + normal.x;
                    const ty = pos.y + normal.y;
                    const tz = pos.z + normal.z;
                    const selectedType = SELECTABLE_BLOCKS[selectedBlockIndex];

                    if (!inventory[selectedType.id] || inventory[selectedType.id] <= 0) return;

                    createBlock(tx, ty, tz, selectedType);
                    inventory[selectedType.id]--;
                    updateHotbarUI();
                }
            }
        }

        // Improved Solid Ground Collision Box
        function checkCollision(pos, currentHeight) {
            const minX = Math.floor(pos.x - player.radius + 0.5);
            const maxX = Math.floor(pos.x + player.radius + 0.5);
            const minY = Math.floor(pos.y - currentHeight + 0.05);
            const maxY = Math.floor(pos.y + 0.1);
            const minZ = Math.floor(pos.z - player.radius + 0.5);
            const maxZ = Math.floor(pos.z + player.radius + 0.5);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        const key = `${x},${y},${z}`;
                        if (blocksMap.has(key)) {
                            if (blockTypeMap.get(key) !== BLOCK_TYPES.WATER.id) return true;
                        }
                    }
                }
            }
            return false;
        }

        function updatePlayer(delta) {
            if (!isTouchDevice) player.isCrouching = keys['ShiftLeft'] || keys['ShiftRight'];
            const currentHeight = player.isCrouching ? player.crouchHeight : player.height;
            const speedMultiplier = player.isCrouching ? 0.45 : 1.0;

            const moveVector = new THREE.Vector3();
            if (keys['KeyW']) moveVector.z -= 1;
            if (keys['KeyS']) moveVector.z += 1;
            if (keys['KeyA']) moveVector.x -= 1;
            if (keys['KeyD']) moveVector.x += 1;

            if (joystick.active) {
                moveVector.x = joystick.deltaX;
                moveVector.z = joystick.deltaY;
            }
            moveVector.normalize();

            const moveSpeed = 5.5 * speedMultiplier;
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);

            const targetVel = new THREE.Vector3()
                .addScaledVector(forward, -moveVector.z * moveSpeed)
                .addScaledVector(right, moveVector.x * moveSpeed);

            player.velocity.x = targetVel.x;
            player.velocity.z = targetVel.z;

            // Gravity & Jump Physics
            player.velocity.y -= 22.0 * delta;
            if (keys['Space'] && player.onGround) {
                player.velocity.y = 7.8;
                player.onGround = false;
            }

            // X Movement
            const oldX = player.position.x;
            player.position.x += player.velocity.x * delta;
            if (checkCollision(player.position, currentHeight)) player.position.x = oldX;

            // Z Movement
            const oldZ = player.position.z;
            player.position.z += player.velocity.z * delta;
            if (checkCollision(player.position, currentHeight)) player.position.z = oldZ;

            // Y Movement (Gravity / Land Solid Check)
            player.position.y += player.velocity.y * delta;
            if (checkCollision(player.position, currentHeight)) {
                if (player.velocity.y < 0) {
                    player.onGround = true;
                    player.velocity.y = 0;
                } else if (player.velocity.y > 0) {
                    player.velocity.y = 0;
                }
                player.position.y = Math.floor(player.position.y) + currentHeight;
            } else {
                player.onGround = false;
            }

            // Fall Protection Respawn
            if (player.position.y < -15) {
                const h = getTerrainHeight(0, 0);
                player.position.set(0, h + 3, 0);
                player.velocity.set(0, 0, 0);
            }

            camera.position.copy(player.position);
        }

        function updateRaycastHighlight() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blocksMap.values()));
            if (intersects.length > 0 && intersects[0].distance <= 6.0) {
                wireframeBox.position.copy(intersects[0].object.position);
                wireframeBox.visible = true;
            } else {
                wireframeBox.visible = false;
            }
        }

        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updatePlayer(delta);
            updateItems(delta);
            updateRaycastHighlight();

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
